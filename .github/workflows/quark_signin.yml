name: 夸克网盘每日签到

on:
  schedule:
    - cron: "0 1 * * *" # 北京时间 09:00
    - cron: "0 5 * * *" # 北京时间 13:00，失败兜底
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只校验凭证与签到状态，不真正提交签到"
        type: boolean
        default: false

# 仅需读权限：当日成功标记走 Actions 缓存，不再往仓库写文件
permissions:
  contents: read

concurrency:
  group: quark-signin-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取北京时间日期
        id: date
        shell: bash
        run: echo "today=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: 恢复今日成功标记
        id: cache-success
        uses: actions/cache/restore@v6
        with:
          path: .cache/quark-signin
          key: quark-signed-${{ steps.date.outputs.today }}

      - name: 今日已全部签到
        if: steps.cache-success.outputs.cache-hit == 'true'
        run: echo "今日已全部签到成功，跳过重复执行。"

      - name: 检出代码
        if: steps.cache-success.outputs.cache-hit != 'true'
        uses: actions/checkout@v7

      - name: 随机延迟
        if: steps.cache-success.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # 定时触发最多等 60 秒；13:00 的兜底轮次再额外错开 2 分钟
          delay=$((RANDOM % 61))
          if [ "$(TZ='Asia/Shanghai' date +%H)" = "13" ]; then
            delay=$((delay + 120))
          fi
          echo "随机延迟 ${delay} 秒后开始执行。"
          sleep "$delay"

      - name: 设置 Python 环境
        if: steps.cache-success.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 安装依赖
        if: steps.cache-success.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: 执行签到脚本
        if: steps.cache-success.outputs.cache-hit != 'true'
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
          SENDKEY: ${{ secrets.SENDKEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python checkIn_Quark.py

      - name: 生成今日成功标记
        # dry_run 只是演练，不能占用当天的成功标记
        if: success() && steps.cache-success.outputs.cache-hit != 'true' && inputs.dry_run != true
        run: |
          mkdir -p .cache/quark-signin
          echo "${{ steps.date.outputs.today }}" > .cache/quark-signin/success

      - name: 保存今日成功标记
        if: success() && steps.cache-success.outputs.cache-hit != 'true' && inputs.dry_run != true
        uses: actions/cache/save@v6
        with:
          path: .cache/quark-signin
          key: quark-signed-${{ steps.date.outputs.today }}
