name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 安装测试依赖
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt

      - name: 检查 Python 语法
        run: python -m compileall -q checkIn_Quark.py push_serverchan.py tests

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

      - name: 未配置凭证时的退出码应为 2
        run: |
          set +e
          python checkIn_Quark.py
          code=$?
          [ "$code" -eq 2 ] || { echo "期望退出码 2，实际 $code"; exit 1; }
